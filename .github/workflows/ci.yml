name: App checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
      - run: npm run build:android
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
